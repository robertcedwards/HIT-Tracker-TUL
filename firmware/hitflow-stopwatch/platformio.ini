; Hit Flow firmware for the M5Stack Stopwatch Dev Kit (ESP32-S3R8).
;
; The Stopwatch is a recent board: round AMOLED (CO5300, QSPI), CST820B touch,
; and a vibration motor + speaker behind an M5IOE1 I2C expander. Board support
; was added in M5Unified >= 0.2.15 / M5GFX >= 0.2.21 — older versions will not
; drive the display. In the Arduino IDE this is the "M5StopWatch" board option;
; under PlatformIO we reproduce that with the ARDUINO_M5STACK_STOPWATCH define
; below so M5Unified configures the QSPI panel correctly.
;
; NOTE: PlatformIO board support for this very new board can lag. If the build
; fails or the screen stays black, the M5Stack-validated path is the Arduino IDE
; with Board Manager >= 3.3.7 and Board = M5StopWatch (see README). You can also
; try the pioarduino platform fork for a newer arduino-esp32 core.

[env:m5stack-stopwatch]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8: 16MB flash, 8MB OPI PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_M5STACK_STOPWATCH   ; mirror the Arduino "M5StopWatch" board option
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial over native USB

monitor_speed = 115200
upload_speed = 1500000

lib_deps =
    m5stack/M5Unified@^0.2.15
    m5stack/M5GFX@^0.2.21
    bblanchon/ArduinoJson@^7.2.0
